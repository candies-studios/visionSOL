<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>visionSOL | Creative Solutions Agency – Design, Content, Digital Marketing &amp; Events</title>
    <meta name="description" content="visionSOL is a creative solutions agency helping brands turn ideas into impact through strategic design, compelling content, powerful digital marketing and unforgettable events." />
    <meta name="theme-color" content="#D6202A" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Open Graph / social sharing (update og:url and og:image once the domain is live) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="visionSOL" />
    <meta property="og:title" content="visionSOL | Creative Solutions Agency" />
    <meta property="og:description" content="Strategic design, compelling content, powerful digital marketing and unforgettable events." />
    <meta property="og:image" content="%BASE_URL%og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- If the browser shows a cached page whose script files were replaced by a newer
         deploy, the script fails to load and the page is blank. Reload once to fetch the
         current version. -->
    <script>
      window.addEventListener('error', function (e) {
        var t = e.target
        if (!t || t.tagName !== 'SCRIPT' || !/\/assets\//.test(t.src || '')) return
        try {
          if (sessionStorage.getItem('vs-reloaded')) return
          sessionStorage.setItem('vs-reloaded', '1')
        } catch (_) {}
        location.reload()
      }, true)
    </script>
    <noscript>Please enable JavaScript to view the visionSOL website.</noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
  </head>

  </body>
